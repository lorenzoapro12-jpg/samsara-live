<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saṃsāra — Marché live</title>
<link rel="stylesheet" href="css/app.css">
<!-- hyalite v0.5.0, MIT © 2026 VII-Cae (VII) — https://github.com/VII-Cae/hyalite--liquid-glass
     Réfraction réelle (SDF + Snell -> carte de déplacement -> filtre SVG -> `backdrop-filter: url(#…)`),
     Chromium seulement ; ailleurs, le `var(--hyalite, <flou>)` des feuilles prend le relais.
     js/vendor/ = code tiers VERBATIM : on ne le modifie pas, on le met à jour. -->
<script defer src="js/vendor/hyalite.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>

<!-- Ambiance Frutiger Aero : photo de fond derrière le verre dépoli.
     Ordre = profondeur : aurore → bokeh → eau (bulles/caustiques). -->
<div class="aero-grid"></div>

<div class="header">
  <div class="header-left">
    <div class="header-orb">🔮</div>
    <h1>Saṃsāra</h1>
    <span class="price-badge" id="price">—</span>
    <span class="cycle-badge" id="cycle">—</span>
  </div>
  <div class="header-right">
    <span id="updated" style="font-size:10px;color:var(--text2);font-variant-numeric:tabular-nums"></span>
    <button class="theme-btn ico-btn" onclick="toggleFeed()" id="feedBtn" title="Marché live (F)" aria-label="Marché live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
    <button class="theme-btn ico-btn" onclick="openLiveModal()" id="liveBtn" title="Lecture LIVE — Binance, à la seconde" aria-label="Lecture live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></button>
    <button class="theme-btn ico-btn" onclick="resetView()" title="Réinitialiser le zoom (R)" aria-label="Réinitialiser le zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    <span class="refresh-dot" id="dot" title="Flux temps réel actif"></span>
    <button class="theme-btn ico-btn" onclick="toggleTheme()" id="themeBtn" title="Thème clair / sombre (D)" aria-label="Changer de thème"><svg class="ico-lune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="ico-soleil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</div>

<div class="indicator-bar" id="indicatorBar">
  <span class="section-title">Overlays</span>
  <label id="lbl_ema20" onclick="toggleInd('ema20',this)"><span class="ind-label ov">EMA20</span></label>
  <label id="lbl_ema50" onclick="toggleInd('ema50',this)"><span class="ind-label ov">EMA50</span></label>
  <label id="lbl_ema100" onclick="toggleInd('ema100',this)"><span class="ind-label ov">EMA100</span></label>
  <label id="lbl_ema200" onclick="toggleInd('ema200',this)"><span class="ind-label ov">EMA200</span></label>
  <label id="lbl_sma20" onclick="toggleInd('sma20',this)"><span class="ind-label ov">SMA20</span></label>
  <label id="lbl_sma50" onclick="toggleInd('sma50',this)"><span class="ind-label ov">SMA50</span></label>
  <label id="lbl_bb" onclick="toggleInd('bb',this)"><span class="ind-label ov">Bollinger</span></label>
  <span class="sep"></span>
  <span class="section-title">Sous-graphes</span>
  <label id="lbl_vol" class="active" onclick="toggleSub('vol',this)"><span class="ind-label sg">Volume</span></label>
  <label id="lbl_rsi" onclick="toggleSub('rsi',this)"><span class="ind-label sg">RSI</span></label>
  <label id="lbl_macd" onclick="toggleSub('macd',this)"><span class="ind-label sg">MACD</span></label>
  <label id="lbl_stoch" onclick="toggleSub('stoch',this)"><span class="ind-label sg">Stoch</span></label>
  <label id="lbl_atr" onclick="toggleSub('atr',this)"><span class="ind-label sg">ATR</span></label>
  <span class="sep"></span>
  <span class="section-title">Intervalle</span>
  <label id="int_1m" onclick="changeInterval('1m',this)"><span class="ind-label">1m</span></label>
  <label id="int_5m" onclick="changeInterval('5m',this)"><span class="ind-label">5m</span></label>
  <label id="int_15m" class="active" onclick="changeInterval('15m',this)"><span class="ind-label">15m</span></label>
  <label id="int_1h" onclick="changeInterval('1h',this)"><span class="ind-label">1h</span></label>
  <label id="int_4h" onclick="changeInterval('4h',this)"><span class="ind-label">4h</span></label>
  <label id="int_1d" onclick="changeInterval('1d',this)"><span class="ind-label">1D</span></label>
  <span class="sep"></span>
  <span class="section-title">Paire</span>
  <label id="sym_BTCUSDT" class="active" onclick="changeSymbol('BTCUSDT',this)"><span class="ind-label">BTC</span></label>
  <label id="sym_SOLUSDT" onclick="changeSymbol('SOLUSDT',this)"><span class="ind-label">SOL</span></label>
  <label id="sym_XRPUSDT" onclick="changeSymbol('XRPUSDT',this)"><span class="ind-label">XRP</span></label>
  <label id="sym_TAOUSDT" onclick="changeSymbol('TAOUSDT',this)"><span class="ind-label">TAO</span></label>
  <label id="sym_BTCSOL" onclick="changeSymbol('BTCSOL',this)"><span class="ind-label">BTC/SOL</span></label>
  <span class="sep"></span>
  <div class="ind-dropdown">
    <button class="ind-dropdown-btn" id="indDropdownBtn" onclick="toggleDropdown(event)">➕ Indicateurs ▾</button>
  </div>
</div>

<!-- Menu dropdown déplacé hors de la barre pour éviter la troncation overflow -->
<div class="ind-dropdown-menu" id="indMenu" onclick="event.stopPropagation()"></div>

<div class="main-area">
<div class="chart-container"><div class="gloss-bubble"></div><div class="lg-ring"></div><canvas id="chart"></canvas></div>

<div class="feed-panel collapsed" id="feedPanel">
  <div class="feed-panel-handle" onclick="toggleFeed()" id="feedHandle">Marché live</div>
  <div class="feed-panel-body">
    <div class="feed" id="feed">
      <div class="loading">📊 En attente des données…</div>
    </div>
  </div>
</div>
</div>

<!-- ═══ GRID BOT SECTION — bottom panel under chart ═══ -->
<div class="strat-section collapsed" id="stratSection">
  <div class="strat-handle" onclick="toggleStratPanel()">
    <span>🤖 Grid Bot</span>
    <span class="strat-handle-arrow">▸</span>
  </div>
  <div class="strat-body" id="stratBody">
    <div class="strat-cols">
      <!-- Colonne gauche : config -->
      <div class="strat-col-config">
        <div class="strat-row">
          <label>Stratégie</label>
          <select id="stratSelect" onchange="onStratChange()"></select>
        </div>
        <!-- « Comment ça marche » + ce que la grille FERAIT maintenant : rempli par renderStratHelp() -->
        <div class="strat-help" id="stratHelp"></div>
        <div class="strat-row">
          <label>Capital</label>
          <input type="number" id="stratCapital" value="1000" min="100" max="100000" step="100" onchange="onStratParamChange()">
        </div>
        <div id="stratParams"></div>
        <div class="strat-row">
          <label>Du</label>
          <input type="datetime-local" id="stratDateFrom" style="flex:1;font-size:11px;padding:2px 6px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font)">
        </div>
        <div class="strat-row">
          <label>Au</label>
          <input type="datetime-local" id="stratDateTo" style="flex:1;font-size:11px;padding:2px 6px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font)">
        </div>
      </div>
      <!-- Colonne milieu : boutons -->
      <div class="strat-col-actions">
        <button class="strat-btn" onclick="onBacktestClick()">▶ Backtest</button>
        <button class="strat-btn secondary" onclick="onFullBacktestClick()">▶ Complet</button>
        <button class="strat-btn forward" id="stratFwdBtn" onclick="onForwardClick()">🔴 Forward</button>
        <button class="strat-btn secondary" id="stratDumbCmp" onclick="onCompareDumbGrid()">📊 vs Grille Fixe</button>
        <button class="strat-btn secondary" onclick="showWalkForward()">🔬 Walk-Forward</button>
        <div class="strat-toggle" onclick="toggleAdvanced()" id="advToggle">⚙ Avancé ▸</div>
      </div>
      <!-- Colonne droite : stats -->
      <div class="strat-col-stats">
        <div class="strat-stats" id="stratStats" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile : modal Marché live -->
<div id="marketModal" class="modal" style="display:none;z-index:1000">
  <div class="modal-tete">
    <span class="modal-titre">Marché live</span>
    <button onclick="closeMarketModal()" class="modal-fermer" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="marketModalBody" class="modal-corps">
    <div class="loading">📊 En attente des données…</div>
  </div>
</div>

<!-- Mobile : modal LECTURE LIVE (bouton ⚡) — n'affiche que ce qui peut être interrogé en direct
     par cette page (Binance). Les autres sources sont agrégées côté serveur, avec leur retard. -->
<div id="liveModal" class="modal" style="display:none;z-index:1001">
  <div class="modal-tete">
    <span class="modal-titre">Lecture live <span id="liveClock"></span></span>
    <button onclick="closeLiveModal()" class="modal-fermer" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="liveModalBody" class="modal-corps">
    <div class="loading">⚡ Interrogation de Binance…</div>
  </div>
</div>

<!-- Vista Aero Taskbar -->
<div class="aero-taskbar" id="taskbar">
  <div class="taskbar-left">
    <span>🔮 Saṃsāra</span>
    <span id="taskbarPair">BTC/USDT</span>
  </div>
  <div class="taskbar-right">
    <span class="taskbar-dot" id="taskbarDot" style="background:var(--green)"></span>
    <span id="taskbarClock">--:--:--</span>
  </div>
</div>

</body>
</html>
