<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saṃsāra — Marché live</title>
<script src="js/binance-repli.js"></script>
<script>
/* Les lectures du premier écran partent ICI, avant les feuilles et les scripts : lancées par
   js/app.js (différé), elles attendaient la fin de son exécution (première page de bougies
   demandée à ~112 ms, mesuré). Mêmes hôtes et mêmes URL que js/app.js, qui reprend ces réponses
   au lieu de les redemander (prechargee) — paire et intervalle par défaut. */
(function () {
  try {
    var B = 'https://api.binance.com/api/v3/', P = window.__precharge = {};
    var lire = function (u, o) { P[u] = fetch(u, o); P[u].catch(function () {}); };
    lire(B + 'klines?symbol=BTCUSDT&interval=15m&limit=1000');
    lire(B + 'ticker/24hr?symbol=BTCUSDT&type=MINI');
    lire('https://raw.githubusercontent.com/lorenzoapro12-jpg/samsara-live/master/market-data.json', { cache: 'no-cache' });
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/app.css">
<!-- THÈMES — un fichier par thème, tous chargés (quelques Ko chacun) : changer de thème ne
     coûte aucune requête. Pour en ajouter un : créer themes/<id>.css (jetons sous
     [data-theme="<id>"]) et ajouter sa ligne ici. data-mode : clair | sombre ;
     data-verre : aucun | givre | refraction (hyalite, Chromium) ; data-paire : le thème
     jumeau de l'autre mode (touche D). tests/test_contrat.py vérifie chaque thème déclaré. -->
<link rel="stylesheet" href="themes/aero.css" data-theme-id="aero" data-nom="Aero" data-mode="clair" data-verre="refraction" data-paire="aero-nuit">
<link rel="stylesheet" href="themes/aero-nuit.css" data-theme-id="aero-nuit" data-nom="Aero nuit" data-mode="sombre" data-verre="refraction" data-paire="aero">
<link rel="stylesheet" href="themes/kala.css" data-theme-id="kala" data-nom="Kāla" data-mode="sombre" data-verre="aucun">
<!-- data-structure : le thème change aussi la STRUCTURE de la page (js/structures.js). -->
<link rel="stylesheet" href="themes/neon.css" data-theme-id="neon" data-nom="Néon" data-mode="sombre" data-verre="aucun" data-structure="hud">
<link rel="stylesheet" href="themes/codex.css" data-theme-id="codex" data-nom="Codex" data-mode="clair" data-verre="aucun" data-structure="codex">
<link rel="stylesheet" href="themes/bureau95.css" data-theme-id="bureau95" data-nom="Bureau 95" data-mode="clair" data-verre="aucun" data-structure="fenetres" data-paire="bureau95-contraste">
<link rel="stylesheet" href="themes/bureau95-contraste.css" data-theme-id="bureau95-contraste" data-nom="Bureau 95 contraste" data-mode="sombre" data-verre="aucun" data-structure="fenetres" data-paire="bureau95">
<link rel="stylesheet" href="themes/gare.css" data-theme-id="gare" data-nom="Gare" data-mode="sombre" data-verre="aucun" data-structure="tableau">
<link rel="stylesheet" href="themes/gazette.css" data-theme-id="gazette" data-nom="Gazette" data-mode="clair" data-verre="aucun" data-structure="une">
<link rel="stylesheet" href="themes/cyanotype.css" data-theme-id="cyanotype" data-nom="Cyanotype" data-mode="sombre" data-verre="aucun" data-structure="planche" data-paire="diazo">
<link rel="stylesheet" href="themes/diazo.css" data-theme-id="diazo" data-nom="Diazo" data-mode="clair" data-verre="aucun" data-structure="planche" data-paire="cyanotype">
<script>
/* Le thème est posé AVANT le premier rendu : posé par app.js (différé), la page s'afficherait
   un instant dans le thème par défaut. */
(function () {
  try {
    var liens = document.querySelectorAll('link[data-theme-id]'), connus = {}, t = null;
    for (var i = 0; i < liens.length; i++) connus[liens[i].getAttribute('data-theme-id')] = 1;
    try {
      t = localStorage.getItem('samsara-theme');
      if (!t && localStorage.getItem('samsara-theme-v2') === 'dark') t = 'aero-nuit';
    } catch (e) {}
    var defaut = liens.length ? liens[0].getAttribute('data-theme-id') : 'aero';
    var choisi = connus[t] ? t : defaut;
    document.documentElement.setAttribute('data-theme', choisi);
    /* Thème à STRUCTURE : la page reste invisible tant que js/structures.js ne l'a pas posée
       (sinon elle s'afficherait un instant dans la structure de base). Filet : 2,5 s. */
    var l = document.querySelector('link[data-theme-id="' + choisi + '"][data-structure]');
    if (l) {
      document.documentElement.setAttribute('data-structure-attendue', l.getAttribute('data-structure'));
      setTimeout(function () { document.documentElement.setAttribute('data-structure-posee', ''); }, 2500);
    }
  } catch (e) {}
  /* Mode de lecture (débutant / expert) : une classe, posée avant le premier rendu. Il change
     le niveau de DÉTAIL affiché, jamais une valeur (js/fiches.js). */
  try { document.documentElement.setAttribute('data-mode', localStorage.getItem('samsara-mode') === 'expert' ? 'expert' : 'debutant'); }
  catch (e) { document.documentElement.setAttribute('data-mode', 'debutant'); }
})();
</script>
<script defer src="js/format.js"></script>
<script defer src="js/cadences.js"></script>
<script defer src="js/structures.js"></script>
<script defer src="js/fiches.js"></script>
<script defer src="js/reglages.js"></script>
<!-- Chronique, horloges et contre-expertise : des cœurs purs, appelés par js/app.js — chargés AVANT lui,
     qui reste le dernier script (les harnais node retirent son init() final). -->
<script defer src="js/chronique.js"></script>
<script defer src="js/horloges.js"></script>
<script defer src="js/contre-expertise.js"></script>
<!-- Guide : le cœur pur des niveaux nommés, du régime, des formes et de la lecture du moment. -->
<script defer src="js/guide.js"></script>
<!-- Scénarios du matin : le cœur pur (lecture de previsions.json, suivi en direct, mots). -->
<script defer src="js/scenarios.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>

<!-- Trame de fond (jeton --trame du thème) : ce que le verre, quand le thème en a, courbe. -->
<div class="aero-grid"></div>

<div class="header">
  <div class="header-left">
    <div class="header-orb" aria-hidden="true"></div>
    <h1>Saṃsāra</h1>
    <!-- Le prix héros : paire, dernier prix, variation 24 h — tous les trois de Binance, À LA
         SECONDE (même requête). Rien ici ne vient du fichier de 15 min : deux cadences ne se
         mélangent pas dans le même bloc. -->
    <div class="hero-prix">
      <button class="paire-btn" id="paireBtn" onclick="ouvrirPaires(event)" aria-haspopup="menu" title="Changer de paire"><span id="paireNom">BTC/USDT</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <span class="price-badge" id="price">—</span>
      <span class="var24" id="var24" title="Variation sur 24 h glissantes — Binance, à la seconde"></span>
    </div>
  </div>
  <!-- Chiffres clés de la dernière PUBLICATION (market-data.json, 15 min) — avec leur âge. -->
  <div class="kpis" id="cycle" onclick="toggleFeed()" title="Dernière publication — cliquer pour le détail"></div>
  <div class="header-right">
    <span id="updated"></span>
    <button class="theme-btn ico-btn expert-seul" onclick="toggleFeed()" id="feedBtn" title="Marché live (F)" aria-label="Marché live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
    <button class="theme-btn ico-btn expert-seul" onclick="openLiveModal()" id="liveBtn" title="Lecture LIVE — Binance, à la seconde" aria-label="Lecture live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></button>
    <button class="theme-btn ico-btn" onclick="resetView()" id="resetBtn" title="Réinitialiser le zoom (R)" aria-label="Réinitialiser le zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    <a class="theme-btn ico-btn" href="bookmap.html" id="carteBtn" title="Carte du carnet (bookmap) — page à côté" aria-label="Carte du carnet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M8 4v16M14 4v16"/></svg></a>
    <button class="theme-btn mode-btn" onclick="basculerMode()" id="modeBtn" title="Niveau de détail : débutant ou expert (M) — les valeurs ne changent pas" aria-pressed="false">Débutant</button>
    <button class="theme-btn ico-btn expert-seul" onclick="ouvrirReglages(this)" id="reglagesBtn" title="Réglages d'affichage : bandes, tranches, profondeur, seuils" aria-label="Réglages d'affichage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    <button class="theme-btn ico-btn" onclick="ouvrirGlossaire(this)" id="legendesBtn" title="Légendes : comment lire chaque indicateur (?)" aria-label="Légendes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6M12 17h.01"/></svg></button>
    <span class="refresh-dot" id="dot" title="Flux temps réel actif"></span>
    <button class="theme-btn ico-btn" onclick="ouvrirThemes(event)" id="themeBtn" title="Thème (T : suivant · D : clair / sombre)" aria-label="Choisir le thème" aria-haspopup="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.9-.7-1.3-.7-2.2 0-.9.8-1.6 1.7-1.6H17a4 4 0 0 0 4-4C21 6.8 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1.1"/><circle cx="10" cy="7.3" r="1.1"/><circle cx="14.6" cy="7.3" r="1.1"/></svg></button>
  </div>
</div>

<div class="indicator-bar" id="indicatorBar">
  <span class="section-title expert-seul">Overlays</span>
  <label id="lbl_ema20" class="expert-seul" onclick="toggleInd('ema20',this)"><span class="ind-label ov">EMA20</span></label>
  <label id="lbl_ema50" class="expert-seul" onclick="toggleInd('ema50',this)"><span class="ind-label ov">EMA50</span></label>
  <label id="lbl_ema100" class="expert-seul" onclick="toggleInd('ema100',this)"><span class="ind-label ov">EMA100</span></label>
  <label id="lbl_ema200" class="expert-seul" onclick="toggleInd('ema200',this)"><span class="ind-label ov">EMA200</span></label>
  <label id="lbl_sma20" class="expert-seul" onclick="toggleInd('sma20',this)"><span class="ind-label ov">SMA20</span></label>
  <label id="lbl_sma50" class="expert-seul" onclick="toggleInd('sma50',this)"><span class="ind-label ov">SMA50</span></label>
  <label id="lbl_bb" class="expert-seul" onclick="toggleInd('bb',this)"><span class="ind-label ov">Bollinger</span></label>
  <span class="sep expert-seul"></span>
  <span class="section-title expert-seul">Sous-graphes</span>
  <label id="lbl_vol" class="active expert-seul" onclick="toggleSub('vol',this)"><span class="ind-label sg">Volume</span></label>
  <label id="lbl_rsi" class="expert-seul" onclick="toggleSub('rsi',this)"><span class="ind-label sg">RSI</span></label>
  <label id="lbl_macd" class="expert-seul" onclick="toggleSub('macd',this)"><span class="ind-label sg">MACD</span></label>
  <label id="lbl_stoch" class="expert-seul" onclick="toggleSub('stoch',this)"><span class="ind-label sg">Stoch</span></label>
  <label id="lbl_atr" class="expert-seul" onclick="toggleSub('atr',this)"><span class="ind-label sg">ATR</span></label>
  <span class="sep expert-seul"></span>
  <span class="section-title">Intervalle</span>
  <label id="int_1m" onclick="changeInterval('1m',this)"><span class="ind-label"><span class="expert-seul">1m</span><span class="debutant-seul">1 min</span></span></label>
  <label id="int_5m" onclick="changeInterval('5m',this)"><span class="ind-label"><span class="expert-seul">5m</span><span class="debutant-seul">5 min</span></span></label>
  <label id="int_15m" class="active" onclick="changeInterval('15m',this)"><span class="ind-label"><span class="expert-seul">15m</span><span class="debutant-seul">15 min</span></span></label>
  <label id="int_1h" onclick="changeInterval('1h',this)"><span class="ind-label"><span class="expert-seul">1h</span><span class="debutant-seul">1 h</span></span></label>
  <label id="int_4h" onclick="changeInterval('4h',this)"><span class="ind-label"><span class="expert-seul">4h</span><span class="debutant-seul">4 h</span></span></label>
  <label id="int_1d" onclick="changeInterval('1d',this)"><span class="ind-label"><span class="expert-seul">1D</span><span class="debutant-seul">1 j</span></span></label>
  <span class="sep"></span>
  <div class="ind-dropdown">
    <button class="ind-dropdown-btn" id="indDropdownBtn" onclick="toggleDropdown(event)" title="Choisir ce qui s’affiche ; chaque ligne explique ce que c’est et comment s’en servir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="expert-seul">Indicateurs</span><span class="debutant-seul">Affichage</span><span class="ind-compte expert-seul" id="indCompte" title="Indicateurs affichés" hidden></span></button>
  </div>
</div>

<!-- Menu dropdown déplacé hors de la barre pour éviter la troncation overflow -->
<div class="ind-dropdown-menu" id="indMenu" onclick="event.stopPropagation()"></div>
<div class="paire-menu" id="paireMenu" role="menu" aria-label="Paires" onclick="event.stopPropagation()">
  <div class="cat-title">Paire</div>
  <label id="sym_BTCUSDT" class="active" role="menuitemradio" onclick="changeSymbol('BTCUSDT',this)"><span class="ind-label">BTC / USDT</span></label>
  <label id="sym_SOLUSDT" role="menuitemradio" onclick="changeSymbol('SOLUSDT',this)"><span class="ind-label">SOL / USDT</span></label>
  <label id="sym_XRPUSDT" role="menuitemradio" onclick="changeSymbol('XRPUSDT',this)"><span class="ind-label">XRP / USDT</span></label>
  <label id="sym_TAOUSDT" role="menuitemradio" onclick="changeSymbol('TAOUSDT',this)"><span class="ind-label">TAO / USDT</span></label>
  <label id="sym_BTCSOL" role="menuitemradio" onclick="changeSymbol('BTCSOL',this)"><span class="ind-label">BTC / SOL</span></label>
</div>
<div class="theme-menu" id="themeMenu" role="menu" aria-label="Thèmes" onclick="event.stopPropagation()"></div>

<div class="main-area">
<div class="chart-container"><div class="gloss-bubble"></div><div class="lg-ring"></div><div class="lg-ring-cotes"></div><canvas id="chart"></canvas><canvas id="chartCalque" class="calque" aria-hidden="true"></canvas><div id="astuceTap" class="astuce-tap debutant-seul" role="status" hidden></div></div>

<div class="feed-panel collapsed" id="feedPanel">
  <div class="feed-panel-handle" onclick="toggleFeed()" id="feedHandle"><span class="expert-seul">Marché live</span><span class="debutant-seul">Infos du marché</span></div>
  <div class="feed-panel-body">
    <div class="feed" id="feed">
      <div class="loading">📊 En attente des données…</div>
    </div>
  </div>
</div>
</div>

<!-- ═══ GRID BOT SECTION — bottom panel under chart ═══ -->
<div class="strat-section collapsed expert-seul" id="stratSection">
  <div class="strat-handle" onclick="toggleStratPanel()">
    <span>🤖 Grid Bot</span>
    <span class="strat-handle-arrow">▸</span>
  </div>
  <div class="strat-body" id="stratBody">
    <div class="strat-cols">
      <!-- Colonne gauche : config -->
      <div class="strat-col-config">
        <div class="strat-row">
          <label>Stratégie</label>
          <select id="stratSelect" onchange="onStratChange()"></select>
        </div>
        <!-- « Comment ça marche » + ce que la grille FERAIT maintenant : rempli par renderStratHelp() -->
        <div class="strat-help" id="stratHelp"></div>
        <div class="strat-row">
          <label>Capital</label>
          <input type="number" id="stratCapital" value="1000" min="100" max="100000" step="100" onchange="onStratParamChange()">
        </div>
        <div id="stratParams"></div>
        <div class="strat-row">
          <label>Du</label>
          <input type="datetime-local" id="stratDateFrom">
        </div>
        <div class="strat-row">
          <label>Au</label>
          <input type="datetime-local" id="stratDateTo">
        </div>
      </div>
      <!-- Colonne milieu : boutons -->
      <div class="strat-col-actions">
        <button class="strat-btn" onclick="onBacktestClick()">▶ Backtest</button>
        <button class="strat-btn secondary" onclick="onFullBacktestClick()">▶ Complet</button>
        <button class="strat-btn forward" id="stratFwdBtn" onclick="onForwardClick()">🔴 Forward</button>
        <button class="strat-btn secondary" id="stratDumbCmp" onclick="onCompareDumbGrid()">📊 vs Grille Fixe</button>
        <button class="strat-btn secondary" onclick="showWalkForward()">🔬 Walk-Forward</button>
        <div class="strat-toggle" onclick="toggleAdvanced()" id="advToggle">⚙ Avancé ▸</div>
      </div>
      <!-- Colonne droite : stats -->
      <div class="strat-col-stats">
        <div class="strat-stats" id="stratStats" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile : modal Marché live -->
<div id="marketModal" class="modal" style="display:none;z-index:1000">
  <div class="modal-tete">
    <span class="modal-titre expert-seul">Marché live</span><span class="modal-titre debutant-seul">Infos du marché</span>
    <button onclick="closeMarketModal()" class="modal-fermer" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="marketModalBody" class="modal-corps">
    <div class="loading">📊 En attente des données…</div>
  </div>
</div>

<!-- Mobile : modal LECTURE LIVE (bouton ⚡) — n'affiche que ce qui peut être interrogé en direct
     par cette page (Binance). Les autres sources sont agrégées côté serveur, avec leur retard. -->
<div id="liveModal" class="modal" style="display:none;z-index:1001">
  <div class="modal-tete">
    <span class="modal-titre">Lecture live <span id="liveClock"></span></span>
    <button onclick="closeLiveModal()" class="modal-fermer" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="liveModalBody" class="modal-corps">
    <div class="loading">⚡ Interrogation de Binance…</div>
  </div>
</div>

<!-- Légende (fiche) : une seule bulle, remplie par js/fiches.js. -->
<div class="fiche-pop" id="fichePop" role="dialog" aria-label="Légende" hidden></div>
<!-- Réglages d'affichage : remplis par js/reglages.js. -->
<div class="fiche-pop reglages-pop" id="reglagesPop" role="dialog" aria-label="Réglages d'affichage" hidden></div>

<!-- Vista Aero Taskbar -->
<div class="aero-taskbar" id="taskbar">
  <div class="taskbar-left">
    <span>🔮 Saṃsāra</span>
    <span id="taskbarPair">BTC/USDT</span>
  </div>
  <div class="taskbar-right">
    <span class="taskbar-dot" id="taskbarDot" style="background:var(--up)"></span>
    <span id="taskbarClock">--:--:--</span>
  </div>
</div>

</body>
</html>
